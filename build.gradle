plugins {
	id 'java'
	id 'org.springframework.boot'
	id 'io.spring.dependency-management'
	id 'io.freefair.lombok'
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'

	implementation project(':surveyor-drivers-web')
	implementation project(':surveyor-usecases')
	implementation project(':surveyor-infrastructure-storage-inmemory')
	implementation project(':surveyor-infrastructure-storage-data-jdbc')
	implementation project(':surveyor-infrastructure-source-metrics-prometheus')
	implementation project(':surveyor-infrastructure-source-events-loki')

	runtimeOnly 'io.micrometer:micrometer-registry-prometheus'
	runtimeOnly 'org.postgresql:postgresql'

	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.boot:spring-boot-testcontainers'
	testImplementation 'org.testcontainers:junit-jupiter'
	testImplementation 'org.testcontainers:postgresql'
}

allprojects {
	pluginManager.withPlugin('java') {
		java {
			toolchain {
				languageVersion = JavaLanguageVersion.of(17)
			}
		}
	}

	plugins.withType(io.freefair.gradle.plugins.lombok.LombokPlugin).whenPluginAdded { p ->
		lombok {
			version = lombokVersion
		}
	}
}

tasks.named('test') {
	useJUnitPlatform()
}

bootBuildImage {
	imageName = "docker.contentgrid.com/surveyor:${project.version}"
	tags = "${project.version}".endsWith('SNAPSHOT') ? [ 'docker.contentgrid.com/surveyor:SNAPSHOT' ] : null

	docker {
		publishRegistry {
			url = project.findProperty('DOCKER_PUBLISH_REGISTRY_URL')
			username = project.findProperty('DOCKER_PUBLISH_REGISTRY_USERNAME')
			password = project.findProperty('DOCKER_PUBLISH_REGISTRY_PASSWORD')
		}
	}
}

bootRun {
	args = ["--spring.profiles.active=bootRun"]
}
