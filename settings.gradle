pluginManagement {
    plugins {
        id 'org.springframework.boot' version "${springBootVersion}"
        id 'io.spring.dependency-management' version "1.1.7"
        id 'io.freefair.lombok' version "${lombokPluginVersion}"
    }
}

plugins {
    id 'eu.xenit.enterprise-conventions.private' version '0.8.0'
}

dependencyResolutionManagement {
    repositories {
        mavenCentral()
    }
}

rootProject.name = 'contentgrid-surveyor'

include 'surveyor-application-surveyor'
include 'surveyor-application-pegman'

include 'surveyor-application-exporter-postgres'
include 'surveyor-application-exporter-cgapp-api'

include 'surveyor-dependencies'

include 'surveyor-api'
include 'surveyor-spi'

include 'surveyor-domain'
include 'surveyor-values'

include 'surveyor-drivers-web'
include 'surveyor-drivers-schedule'

include 'surveyor-infrastructure-config-spring'
include 'surveyor-infrastructure-storage-inmemory'
include 'surveyor-infrastructure-storage-pullthrough'
include 'surveyor-infrastructure-storage-data-r2dbc'
include 'surveyor-infrastructure-storage-tests'
include 'surveyor-infrastructure-collector-prometheus'
include 'surveyor-infrastructure-collector-pegman'
include 'surveyor-infrastructure-resource-linkage-captain'

include 'surveyor-usecases'

include 'jackson-streaming-parser'
include 'surveyor-testcontainers'

