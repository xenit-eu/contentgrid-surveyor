plugins {
    id 'java'
    id 'org.springframework.boot'
    id 'io.spring.dependency-management'
    id 'io.freefair.lombok'
}

dependencies {
    implementation platform(project(':surveyor-dependencies'))
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-amqp'
    implementation 'io.prometheus:prometheus-metrics-core:1.1.0'
    implementation 'io.prometheus:prometheus-metrics-exporter-common:1.1.0'
    implementation 'io.prometheus:prometheus-metrics-exporter-servlet-jakarta:1.1.0'
    implementation 'jakarta.servlet:jakarta.servlet-api'

    implementation 'com.contentgrid.spring:contentgrid-spring-boot-autoconfigure:0.11.1'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

bootBuildImage {
    imageName = "ghcr.io/xenit-eu/contentgrid-surveyor-exporter-cgapp:${project.version}"
    tags = "${project.version}".endsWith('SNAPSHOT') ? ['ghcr.io/xenit-eu/contentgrid-surveyor-exporter-cgapp:SNAPSHOT'] : null

    docker {
        publishRegistry {
            url = project.findProperty('DOCKER_PUBLISH_REGISTRY_URL')
            username = project.findProperty('DOCKER_PUBLISH_REGISTRY_USERNAME')
            password = project.findProperty('DOCKER_PUBLISH_REGISTRY_PASSWORD')
        }
    }
}

bootRun {
    args = ["--spring.profiles.active=bootRun"]
}