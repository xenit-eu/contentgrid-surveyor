plugins {
    id 'java-platform'
}

javaPlatform {
    allowDependencies()
}

dependencies {
    api platform("org.springframework.boot:spring-boot-dependencies:${springBootVersion}")

    constraints {
        api 'org.bouncycastle:bcpkix-jdk15on:1.70'
        api 'com.jayway.restassured:rest-assured:2.9.0'
        api 'com.contentgrid.hateoas:contentgrid-hateoas-spring:0.0.1-SNAPSHOT'
        api 'io.prometheus:prometheus-metrics-core:1.3.3'
        api 'io.prometheus:prometheus-metrics-exporter-common:1.3.2'
        api 'io.prometheus:prometheus-metrics-exporter-servlet-jakarta:1.3.2'
    }
}
