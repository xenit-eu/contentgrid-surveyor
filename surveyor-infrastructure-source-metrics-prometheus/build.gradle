plugins {
    id 'java-library'
    id 'java-test-fixtures'
    id 'io.freefair.lombok'
}
dependencies {
    implementation platform(project(':surveyor-dependencies'))
    implementation 'org.springframework:spring-webflux'
    implementation 'com.fasterxml.jackson.core:jackson-databind'
    implementation 'org.slf4j:slf4j-api'
    implementation 'org.springframework.boot:spring-boot-starter'
    implementation project(':jackson-streaming-parser')

    api project(':surveyor-spi')

    testImplementation 'org.junit.jupiter:junit-jupiter-engine'
    testImplementation 'org.junit.jupiter:junit-jupiter-params'
    testImplementation 'org.assertj:assertj-core'
    testImplementation 'org.testcontainers:junit-jupiter'

    testFixturesImplementation platform(project(':surveyor-dependencies'))
    testFixturesApi 'org.testcontainers:testcontainers'
    testFixturesImplementation 'org.awaitility:awaitility'
    testFixturesImplementation 'org.springframework:spring-webflux'
}
